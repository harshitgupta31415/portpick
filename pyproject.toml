[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "portpick-cli"
version = "0.1.0"
description = "Find predictable available TCP ports for local development and CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harshit Gupta" }]
keywords = ["ports", "tcp", "cli", "development", "ci"]

[project.scripts]
portpick = "portpick.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
